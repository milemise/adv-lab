<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ADV-Lab · Nota</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/statics/css/style.css"></head><body class="min-h-screen bg-[#070914] text-slate-100"><div class="space-scene" aria-hidden="true"><div class="nebula"></div><div class="stars stars-a"></div><div class="stars stars-b"></div><div class="stars stars-c"></div></div><main class="relative z-10 max-w-4xl mx-auto px-4 py-16"><a href="/#noticias" class="text-cyan-200 text-sm">← Volver a noticias</a><article id="article" class="mt-8 panel-card rounded-3xl overflow-hidden"></article></main><script>const slug={{ slug|tojson }};const h=(t)=>{const d=document.createElement('div');d.textContent=t||'';return d.innerHTML};fetch('/api/articles/'+encodeURIComponent(slug)).then(r=>r.json()).then(a=>{document.title='ADV-Lab · '+a.title;document.getElementById('article').innerHTML=`<img src="${a.cover}" class="w-full aspect-[16/7] object-cover"><div class="p-7 md:p-10"><p class="mono-label text-slate-500">${h(a.author)}</p><h1 class="font-display text-4xl md:text-6xl mt-2">${h(a.title)}</h1><div class="mt-8 text-slate-300 leading-8 whitespace-pre-line">${h(a.content)}</div></div>`}).catch(()=>{document.getElementById('article').innerHTML='<div class="p-10">No se pudo cargar la nota.</div>'});</script></body></html>
