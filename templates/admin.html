<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV-Lab | Mesa Editorial (Admin)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        space: {
                            dark: '#050508',
                            panel: '#0d0d14',
                            border: '#232336',
                            accent: '#c5a880',
                            muted: '#8a8a9e'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #050508; color: #e2e8f0; overflow-x: hidden; }
        .editorial-border { border: 1px solid #232336; }
        .editorial-border-b { border-bottom: 1px solid #232336; }
        
        .editorial-input {
            background: #050508; border: 1px solid #232336;
            color: #fff; border-radius: 0; transition: border-color 0.3s ease; width: 100%;
        }
        .editorial-input:focus { border-color: #c5a880; outline: none; }
        .editorial-input::placeholder { color: #8a8a9e; }

        .admin-tab-active { color: #fff; border-bottom: 2px solid #c5a880; }
        .admin-tab-inactive { color: #8a8a9e; border-bottom: 2px solid transparent; }
        .admin-tab-inactive:hover { color: #fff; }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <header class="fixed top-0 w-full z-40 bg-space-dark/90 backdrop-blur-md editorial-border-b">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fa-solid fa-meteor text-space-accent text-xl"></i>
                <h1 class="text-2xl font-bold font-serif tracking-widest text-white">ADV-Lab <span class="text-xs font-mono text-space-muted uppercase ml-2">/ Admin</span></h1>
            </a>
            <a href="index.html" class="text-xs font-mono tracking-widest uppercase border border-[#232336] px-5 py-2.5 hover:bg-white hover:text-black transition-all font-bold">
                Volver al Sitio
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto pt-32 px-6 w-full relative mb-24">
        
        <!-- SECCIÓN DE AUTENTICACIÓN -->
        <header id="auth-container" class="text-center max-w-xl mx-auto space-y-6 mb-12">
            <span class="text-xs font-mono tracking-widest uppercase px-3 py-1 border border-red-500/30 text-red-400 bg-red-950/20">Acceso Restringido</span>
            <h2 class="text-4xl font-serif font-bold text-white">Mesa Editorial</h2>
            <div class="max-w-xs mx-auto space-y-4 mt-6">
                <input type="password" id="admin-password" placeholder="CLAVE DE ACCESO" class="editorial-input text-center py-3 text-xs font-mono uppercase tracking-widest">
                <button onclick="unlockAdmin()" class="w-full py-3 bg-white text-black font-mono text-xs uppercase font-bold tracking-widest hover:bg-space-accent transition-colors">Ingresar</button>
            </div>
        </header>

        <!-- CONTENIDO DEL PANEL DE ADMIN (BLOQUEADO INICIALMENTE) -->
        <div id="admin-content" class="hidden space-y-8">
            <div class="flex justify-center gap-8 text-xs font-mono tracking-widest uppercase border-b border-[#232336] pb-4 flex-wrap">
                <button onclick="switchAdminTab('pending')" id="admin-tab-pending" class="admin-tab-inactive pb-4 -mb-4">En Revisión</button>
                <button onclick="switchAdminTab('approved')" id="admin-tab-approved" class="admin-tab-active pb-4 -mb-4 font-bold text-white">Obras Públicas</button>
                <button onclick="switchAdminTab('illustrations')" id="admin-tab-illustrations" class="admin-tab-inactive pb-4 -mb-4 text-space-accent">Subir Ilustración</button>
            </div>

            <!-- CONTENEDOR DE TARJETAS DE OBRAS -->
            <div id="admin-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            
            <!-- FORMULARIO PARA SUBIR NUEVAS ILUSTRACIONES CIENTÍFICAS -->
            <div id="admin-illustrations-upload" class="hidden max-w-2xl mx-auto editorial-border p-8 bg-space-panel">
                <h3 class="text-2xl font-serif font-bold text-white mb-6">Subir Ilustración Científica</h3>
                <form onsubmit="handleAdminIllustrationUpload(event)" class="space-y-6">
                    <input type="file" id="admin-file" accept="image/*" class="w-full p-3 editorial-input text-xs font-mono" required>
                    <input type="text" id="admin-title" placeholder="TÍTULO DE LA OBRA" class="editorial-input p-3 text-xs font-mono uppercase tracking-wide" required>
                    <textarea id="admin-desc" placeholder="DESCRIPCIÓN (Opcional)" rows="3" class="w-full editorial-input p-3 text-xs font-mono uppercase tracking-wide"></textarea>
                    <button type="submit" class="w-full py-4 bg-white text-black font-mono text-xs uppercase font-bold tracking-widest hover:bg-space-accent transition-colors">
                        Publicar Ilustración
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="mt-auto editorial-border-t bg-space-dark py-8">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs font-mono text-space-muted">
            <p>© 2026 ADV-Lab. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        function unlockAdmin() {
            const password = document.getElementById('admin-password').value;
            if (password === 'ADV2026') {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                switchAdminTab('pending');
            } else {
                alert("Clave incorrecta.");
            }
        }

        function switchAdminTab(tab) {
            ['pending', 'approved', 'illustrations'].forEach(t => {
                const el = document.getElementById('admin-tab-' + t);
                if(el) el.className = "admin-tab-inactive pb-4 -mb-4 hover:text-white text-space-muted";
            });
            const act = document.getElementById('admin-tab-' + tab);
            if(act) act.className = "admin-tab-active pb-4 -mb-4 font-bold text-white";

            const container = document.getElementById('admin-container');
            const uploadBox = document.getElementById('admin-illustrations-upload');
            
            if (tab === 'illustrations') {
                container.innerHTML = '';
                uploadBox.classList.remove('hidden');
                return;
            }
            uploadBox.classList.add('hidden');

            if (tab === 'pending') {
                const pending = JSON.parse(localStorage.getItem('adv_pending') || '[]');
                if (pending.length === 0) {
                    container.innerHTML = '<p class="text-space-muted font-mono text-sm col-span-full text-center">No hay obras pendientes de revisión.</p>';
                    return;
                }
                container.innerHTML = '';
                pending.forEach(item => {
                    container.innerHTML += `
                        <div class="editorial-border p-6 bg-space-panel flex flex-col justify-between">
                            <div>
                                <img src="${item.img}" class="w-full h-48 object-cover mb-4">
                                <h4 class="text-xl font-serif font-bold text-white">${item.title}</h4>
                                <p class="text-xs text-space-accent font-mono mt-1">Autor: ${item.firstname} ${item.lastname} (${item.email})</p>
                                <p class="text-xs text-space-muted mt-2">${item.desc || 'Sin descripción'}</p>
                            </div>
                            <div class="flex gap-4 mt-6">
                                <button onclick="approveItem(${item.id})" class="w-1/2 py-2 bg-white text-black font-mono text-[10px] uppercase font-bold hover:bg-space-accent transition-colors">Aprobar</button>
                                <button onclick="rejectItem(${item.id})" class="w-1/2 py-2 border border-red-500/50 text-red-400 font-mono text-[10px] uppercase font-bold hover:bg-red-500/10 transition-colors">Rechazar</button>
                            </div>
                        </div>
                    `;
                });
            } else if (tab === 'approved') {
                const approved = JSON.parse(localStorage.getItem('adv_approved') || '[]');
                if (approved.length === 0) {
                    container.innerHTML = '<p class="text-space-muted font-mono text-sm col-span-full text-center">No hay obras públicas en la exhibición.</p>';
                    return;
                }
                container.innerHTML = '';
                approved.forEach(item => {
                    container.innerHTML += `
                        <div class="editorial-border p-6 bg-space-panel flex flex-col justify-between">
                            <div>
                                <img src="${item.img}" class="w-full h-48 object-cover mb-4">
                                <h4 class="text-xl font-serif font-bold text-white">${item.title}</h4>
                                <p class="text-xs text-space-accent font-mono mt-1">Autor: ${item.firstname} ${item.lastname}</p>
                            </div>
                            <button onclick="removeApprovedItem(${item.id})" class="w-full mt-6 py-2 border border-red-500/50 text-red-400 font-mono text-[10px] uppercase font-bold hover:bg-red-500/10 transition-colors">Eliminar de Exhibición</button>
                        </div>
                    `;
                });
            }
        }

        function approveItem(id) {
            let pending = JSON.parse(localStorage.getItem('adv_pending') || '[]');
            let approved = JSON.parse(localStorage.getItem('adv_approved') || '[]');
            const index = pending.findIndex(i => i.id === id);
            if (index !== -1) {
                approved.push(pending[index]);
                pending.splice(index, 1);
                localStorage.setItem('adv_pending', JSON.stringify(pending));
                localStorage.setItem('adv_approved', JSON.stringify(approved));
                switchAdminTab('pending');
            }
        }

        function rejectItem(id) {
            let pending = JSON.parse(localStorage.getItem('adv_pending') || '[]');
            pending = pending.filter(i => i.id !== id);
            localStorage.setItem('adv_pending', JSON.stringify(pending));
            switchAdminTab('pending');
        }

        function removeApprovedItem(id) {
            let approved = JSON.parse(localStorage.getItem('adv_approved') || '[]');
            approved = approved.filter(i => i.id !== id);
            localStorage.setItem('adv_approved', JSON.stringify(approved));
            switchAdminTab('approved');
        }

        function handleAdminIllustrationUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('admin-file');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const newIll = {
                    id: Date.now(),
                    title: document.getElementById('admin-title').value,
                    desc: document.getElementById('admin-desc').value,
                    img: e.target.result
                };
                const illustrations = JSON.parse(localStorage.getItem('adv_illustrations') || '[]');
                illustrations.push(newIll);
                localStorage.setItem('adv_illustrations', JSON.stringify(illustrations));
                alert("Ilustración publicada exitosamente.");
                event.target.reset();
                switchAdminTab('approved');
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
